<svg width="800" height="100" xmlns="http://www.w3.org/2000/svg">
  <text id="userWins" x="20" y="50" font-family="Arial" font-size="24" fill="blue">
   User Wins =
  </text>
  <text id="userWinsNum" x="160" y="50" font-family="Arial" font-size="24" fill="red">
   0
  </text>
  <text id="compWins" x="230" y="50" font-family="Arial" font-size="24" fill="blue">
   Computer Wins =
  </text>
  <text id="compWinsNum" x="420" y="50" font-family="Arial" font-size="24" fill="red">
   0
  </text>
  <text id="Ties" x="500" y="50" font-family="Arial" font-size="24" fill="blue">
   Ties =
  </text>
  <text id="tiesNum" x="570" y="50" font-family="Arial" font-size="24" fill="red">
   0
  </text>

  <!-- JavaScript will go here --> 
  <script> 
	 
	//Create Constants for Rock Paper Scissors
	const R=1;
	const P=2;
	const S=3;
	
	//Create running totals
	let userWinCount=0;
	let compWinCount=0;
	let usercompTies=0;
	
	
	//Set a timer interval to allow for a spinning random look for the computers selection
	var intervalId;
	
	//https://www.w3schools.com/jsreF/met_document_getelementsbyclassname.asp
	//The getElementsByClassName() method returns a collection of elements with a specified class name(s).
	
	//Get Hands objects
	const hands = document.getElementsByClassName("hover-hand")
	
	for (const hand of hands) {
		hand.addEventListener('click', (event) => {
			runRPS(event, hand)})
	}
	
	//Watch for key press to implement the users choice from the keyboard instead of just clicking the objects
	document.addEventListener('keydown', (event) => {
		
		//https://www.w3schools.com/js/js_switch.asp
		//Based on a condition, switch selects one or more code blocks to be executed.
		switch(event.key) {
		  case 'R','r':
			runRPS(event,document.getElementById("handRock"));
			
			break;
		  case 'P','p':
			runRPS(event,document.getElementById("handPaper"));
			
			break;
		  case 'S','s':
			runRPS(event,document.getElementById("handScissors"));
		
			break;
		  default:
			// code block
		}
	});
	
	//Randmonly show a hand image for the computers selection
	function showCompHandLoop() {
		let compSec = document.getElementById("compSelection");
		
		let compsecHand = compSec.querySelector('path');
		
		if (compsecHand != undefined)
			compSec.removeChild(compsecHand);
			
		var theRanNum = Math.floor(Math.random()*3)+1;
		
		switch(theRanNum) {
		  case R:
			objHand = document.getElementById("handRock");
			
			break;
		  case P:
			objHand = document.getElementById("handPaper");
			
			break;
		  case S:
			objHand = document.getElementById("handScissors");
		
			break;
		  default:
			// code block
		}
		
		//https://www.w3schools.com/jsref/met_document_queryselector.asp
		
		objHandPathElement = objHand.querySelector('path');
		clonePath = objHandPathElement.cloneNode(true);
		compSec.appendChild(clonePath);
	}
	
	//After a round is complete restart the cycle
	function restartRandomizer() {
		
		//Clear out last events
		//https://www.w3schools.com/jsref/met_win_clearinterval.asp
		//The clearInterval() method clears a timer set with the setInterval() method.
		clearInterval(randomizerID);
		document.getElementById("output").textContent = "";
		document.getElementById("CompSelected").textContent = ""
		
		const handBGs = document.getElementsByClassName("handBG")
		for (const handBG of handBGs) {
			handBG.style.fill = 'white';
		}
		
		intervalId = setInterval(showCompHandLoop, 100);
	}
	
	//Start the visual loop
	//https://www.w3schools.com/jsref/met_win_setinterval.asp
	//The setInterval() method calls a function at specified intervals (in milliseconds).
	var randomizerID = setInterval(restartRandomizer, 100);
	
	//Run the Rock Paper Scissors logic
	function runRPS(event, obj){
	
		const handBGs = document.getElementsByClassName("handBG")
		for (const handBG of handBGs) {
			handBG.style.fill = 'white';
		}
		
		let bgRect = obj.querySelector('rect');
		
		bgRect.style.fill = 'yellow';
		
		clearInterval(intervalId);
						
		// Math.random gets you a value from 0-1. By multiplying by 3,
		 // you will get a value from 0-2. Then, add 1 to get 1-3.
		 // The floor removes the decimal part.
		var theRanNum = Math.floor(Math.random()*3)+1;
	  
		//console.log(theRanNum); //print it out, in case you want to check
		
		//get users choice from the selected image (Rock, Paper, Scissors)
		let usersChoice = parseInt(obj.attributes["data-value"].value);
		
		//Get the SVG element for the computers selection
		let compSec = document.getElementById("compSelection");
		
		let compsecHand = compSec.querySelector('path');
		
		if (compsecHand != undefined)
			compSec.removeChild(compsecHand);
				
		let objHand;
		let objHandPathElement;
		let clonePath;
		
		
		//https://www.w3schools.com/js/js_switch.asp
		//Based on a condition, switch selects one or more code blocks to be executed.
		switch(theRanNum) {
		  case R:
			objHand = document.getElementById("handRock");
			document.getElementById("CompSelected").textContent = "Rock"
			break;
		  case P:
			objHand = document.getElementById("handPaper");
			document.getElementById("CompSelected").textContent = "Paper"
			break;
		  case S:
			objHand = document.getElementById("handScissors");
			document.getElementById("CompSelected").textContent = "Scissors"
		
			break;
		  default:
			// code block
		}
		
		if (usersChoice == theRanNum)
			{
				document.getElementById("output").textContent  = "It's a Tie!";
				
				usercompTies +=1;
				
				document.getElementById("tiesNum").textContent = usercompTies ;
					
			}
		else if (usersChoice == 1 && theRanNum == 2)
			{
				document.getElementById("output").textContent  = "Paper Covers Rock. Computer Wins!";
				
				compWinCount += 1;
				
				document.getElementById("compWinsNum").textContent = compWinCount ;
			}	
		else if (usersChoice == 2 && theRanNum == 3)
			{
				document.getElementById("output").textContent  = "Scissors cuts Paper. Computer Wins!";
				
				compWinCount += 1;
				
				document.getElementById("compWinsNum").textContent = compWinCount ;
			}	
		else if (usersChoice == 3 && theRanNum == 1)
			{
				document.getElementById("output").textContent  = "Rock crushes Scissors. Computer Wins!";
				
				compWinCount += 1;
					
				document.getElementById("compWinsNum").textContent = compWinCount ;
			}	
		else if (usersChoice == 2 && theRanNum == 1)
			{
				document.getElementById("output").textContent  = "Paper Covers Rock. You Win!";
				
				userWinCount += 1;
				
				document.getElementById("userWinsNum").textContent = userWinCount ;
			}	
		else if (usersChoice == 3 && theRanNum == 2)
			{
				document.getElementById("output").textContent  = "Scissors cuts Paper. You Win!";
				
				userWinCount += 1;
				
				document.getElementById("userWinsNum").textContent  = userWinCount ;
			}
		else if (usersChoice == 1 && theRanNum == 3)
			{
				document.getElementById("output").textContent  = "Rock crushes Scissors. You Win!";
				
				userWinCount += 1;
				
				document.getElementById("userWinsNum").textContent = userWinCount ;
			}
		
		objHandPathElement = objHand.querySelector('path');
		clonePath = objHandPathElement.cloneNode(true);
		compSec.appendChild(clonePath);
		
		clearInterval(randomizerID);
		randomizerID = setInterval(restartRandomizer, 5000);

	}
	
	
	 
  </script>
