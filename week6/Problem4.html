 <script>
    let question1;
    let question2;

    question1 = confirm("Do you like pasta?");
    question2 = confirm("Do you like chicken?");

    if (question1 && question2) {
        document.write("<h3>You love delicious things!</h3>");
    } else if (question1 && !question2 || !question1 && question2) {
        document.write("<h3>You have good taste!</h3>");
    } else if (!question1 && !question2) {
        document.write("<h3>Maybe you’ll find something you like someday!</h3>");
    }
 


 </script>
